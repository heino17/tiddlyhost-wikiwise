# Aktive Projekt-Konfiguration – bewusst gesetzte Regeln

# Parkliste für Altbestand (von `haml-lint --auto-gen-config` erzeugt)
inherits_from: .haml-lint_todo.yml

linters:
  LineLength:
    max: 200            # Deine bewusste Erhöhung

  # ViewLength: liegt komplett in .haml-lint_todo.yml (Altbestand + die
  # bewusst langen Rechtsseiten), sonst überschreibt dieser Block die
  # geerbte Exclude-Liste und die Altbestandseinträge fallen durch.

  InlineStyles:
    enabled: false      # Erlaubt Inline-Styles vorerst

  SpaceBeforeScript:
    enabled: true       # Gute Praxis – behalten

  SpaceInsideHashAttributes:
    enabled: true       # Gute Praxis – behalten

# Keine auskommentierten Blöcke mehr – die verursachen den nil-Crash
# Wenn du später excludes für LineLength brauchst → als Array hinzufügen