# Tiddlyhost-Wikiwise – HTTP-Reverse-Proxy (ohne TLS).
#
# Absichtlich schlank: alles wird an Rails weitergeleitet. Das Image setzt
# RAILS_SERVE_STATIC_FILES=true und bedient Assets/Empties/Core-JS selbst,
# wir müssen also keine Verzeichnisse im Container kennen.
#
# TLS (mit Zertifikaten aus docker/letsencrypt) folgt in einer späteren
# Version; siehe README.md.

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                  '$status $body_bytes_sent "$http_referer" '
                  '"$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  sendfile on;
  keepalive_timeout 65;
  server_tokens off;

  # TiddlyWiki-Dateien können mehrere MB groß sein.
  client_max_body_size 64m;

  # Speichern großer Wikis dauert lange (vgl. server-common.conf.j2).
  proxy_read_timeout 180s;
  proxy_send_timeout 180s;

  # Docker's embedded DNS. Wir lösen "app" deshalb zur Laufzeit auf (statt
  # über einen upstream-Block beim Start), damit nginx nach einem
  # `docker compose up -d` mit neuem Image nicht auf dessen alte IP zeigt
  # und mit 502 antwortet.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 80;
    server_name _;

    # $http_host statt $host, damit ein nicht-Standard-Port erhalten bleibt
    # ($host strippt ihn, dann fehlt er in erzeugten Weiterleitungen).
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # SimpleWiki's conflict detection compares the ETag header. gzip
    # would remove it, so the island API stays uncompressed.
    location /simplewiki/ {
      set $tiddlyhost_app app:3333;
      proxy_pass http://$tiddlyhost_app;
      proxy_redirect off;
      gzip off;
    }

    location / {
      # Variable zwingt nginx zur Auflösung über den resolver oben.
      set $tiddlyhost_app app:3333;
      proxy_pass http://$tiddlyhost_app;
      proxy_redirect off;

      # Kompression großer HTML/JSON-Antworten.
      gzip on;
      gzip_types text/css application/javascript application/json text/html;
    }
  }
}
