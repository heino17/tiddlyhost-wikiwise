# Tiddlyhost-Wikiwise – Produktions-Stack für Endanwender.
#
# Anders als docker-compose-prod.yml im Repo-Root braucht diese Datei
# weder lokalen Quellcode noch einen Build: alles steckt im Image.
#
#   docker compose up -d
#
# Siehe ./README.md.

services:
  web:
    image: nginx:1.27-alpine
    container_name: th_deploy_web
    restart: unless-stopped
    depends_on:
      - app
    profiles: ["http"]
    ports:
      - "${HTTP_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  caddy:
    image: caddy:2-alpine
    container_name: th_deploy_caddy
    restart: unless-stopped
    depends_on:
      - app
    profiles: ["tls"]
    ports:
      - "80:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/etc/caddy/certs:ro
      - caddy_data:/data
      - caddy_config:/config

  app:
    image: ${TIDDLHOST_IMAGE:-ghcr.io/heino17/tiddlyhost-wikiwise:latest}
    container_name: th_deploy_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      # Rails braucht in production einen Secret Key.
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:? Bitte zuerst ./install.sh ausführen (fehlt in .env)}
      # Nutzt den standard Rails-Weg DATABASE_URL.
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:?Bitte zuerst ./install.sh ausführen (fehlt in .env)}@db:5432/tiddlyhost
    volumes:
      - ./config/settings_local.yml:/opt/app/config/settings_local.yml:ro
      - app-log:/var/log/app
      - app-storage:/opt/app/storage
      - app-storage1:/opt/app/storage1
      - app-storage2:/opt/app/storage2
    security_opt:
      - "seccomp:unconfined"

  jobs:
    image: ${TIDDLHOST_IMAGE:-ghcr.io/heino17/tiddlyhost-wikiwise:latest}
    container_name: th_deploy_jobs
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:? Bitte zuerst ./install.sh ausführen (fehlt in .env)}
      DATABASE_URL: postgres://postgres:${DB_PASSWORD:?Bitte zuerst ./install.sh ausführen (fehlt in .env)}@db:5432/tiddlyhost
    command: /bin/start-delayed-job.sh
    volumes:
      - ./config/settings_local.yml:/opt/app/config/settings_local.yml:ro
      - app-log:/var/log/app
      - app-storage:/opt/app/storage
      - app-storage1:/opt/app/storage1
      - app-storage2:/opt/app/storage2
    security_opt:
      - "seccomp:unconfined"

  cache:
    image: memcached:1.6-alpine
    container_name: th_deploy_cache
    restart: unless-stopped
    command: memcached -I 8M

  db:
    image: postgres:16
    container_name: th_deploy_db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:? Bitte zuerst ./install.sh ausführen (fehlt in .env)}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
    name: th_deploy_db_data
  app-log:
    name: th_deploy_app_log
  app-storage:
    name: th_deploy_app_storage
  app-storage1:
    name: th_deploy_app_storage1
  app-storage2:
    name: th_deploy_app_storage2
  caddy_data:
    name: th_deploy_caddy_data
  caddy_config:
    name: th_deploy_caddy_config
